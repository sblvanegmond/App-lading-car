name: Coach synchroniseren

# Haalt Strava en Garmin op en zet ze versleuteld op de branch coach-data,
# waar de coach-app ze leest. Zie coach/README.md voor de secrets.
#
# Geplande workflows draaien alleen op de standaardbranch. Cron loopt op
# UTC; om de twee uur tussen 04:23 en 22:23 UTC dekt de hele dag af.
on:
  schedule:
    - cron: '23 4-22/2 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Alles in het venster opnieuw ophalen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: coach-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: coach/sync/requirements.txt

      - name: Bibliotheken installeren
        run: pip install -r coach/sync/requirements.txt

      - name: Vorige data ophalen
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          if git fetch --quiet --depth=1 origin coach-data 2>/dev/null; then
            for f in bundle.enc.json state.enc.json; do
              git show "FETCH_HEAD:$f" > "$RUNNER_TEMP/previous/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/previous/$f"
            done
            echo "Vorige data gevonden."
          else
            echo "Nog geen branch coach-data: eerste keer."
          fi

      - name: Strava en Garmin ophalen
        id: sync
        env:
          TZ: Europe/Amsterdam
          COACH_SYNC_KEY: ${{ secrets.COACH_SYNC_KEY }}
          COACH_HISTORY_DAYS: ${{ vars.COACH_HISTORY_DAYS }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: >-
          python coach/sync/sync.py
          --previous "$RUNNER_TEMP/previous"
          --out "$RUNNER_TEMP/coach-data"
          ${{ inputs.full && '--full' || '' }}

      # Ook als één bron faalde: de andere bron en de foutmelding moeten de
      # app bereiken. De job kleurt dan wel rood, zodat je een mail krijgt.
      - name: Publiceren op coach-data
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/coach-data" 2>/dev/null || { echo "Niets om te publiceren."; exit 0; }
          test -f bundle.enc.json || { echo "Geen bundel gemaakt."; exit 0; }
          printf '%s\n' \
            '# coach-data' '' \
            'Versleutelde gegevens voor de coach-app. Zonder de synchronisatiesleutel' \
            'zijn ze niet te lezen. Deze branch wordt bij elke synchronisatie' \
            'overschreven door de workflow "Coach synchroniseren".' > README.md
          git init --quiet --initial-branch=coach-data
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bundle.enc.json state.enc.json README.md
          git commit --quiet -m "Coachdata $(date -u +%Y-%m-%dT%H:%MZ)"
          # Eén commit, steeds overschreven: oude versleutelde versies hoeven
          # niet in de geschiedenis te blijven staan.
          git push --quiet --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:coach-data
          echo "Gepubliceerd op coach-data."
