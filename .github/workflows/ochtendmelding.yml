name: Ochtendmelding

on:
  # Elk uur in de ochtend. tools/notify.js stuurt alleen in het uur na de
  # tijd uit notify-config.json, zodat zomer- en wintertijd vanzelf goed
  # gaan. Cron loopt namelijk altijd op UTC.
  schedule:
    - cron: '5 3,4,5,6,7 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Nu meteen sturen, ook buiten het venster'
        type: boolean
        default: true

jobs:
  melden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verzendbibliotheek installeren
        run: npm install --no-save web-push
      - name: Laadplan berekenen en versturen
        env:
          TZ: Europe/Amsterdam
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: node tools/notify.js ${{ inputs.force && '--force' || '' }}
