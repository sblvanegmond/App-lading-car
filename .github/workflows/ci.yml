name: Tests

# Op elke branch en elke pull request. GitHub evalueert geen expressies in
# een trigger, dus de standaardbranch kan hier niet worden uitgezonderd; een
# dubbele run van een test van vijf seconden is dat niet waard.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests van de coach-synchronisatie
        run: |
          pip install --quiet cryptography==50.0.1
          python -m unittest discover -s coach/sync
