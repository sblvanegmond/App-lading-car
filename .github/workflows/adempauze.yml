name: Adempauze (Android)

# Bouwt de Android-app bij elke push die iets in adempauze/ verandert, draait
# de tests en zet de APK als download onder Releases. Op je telefoon open je
# dan https://github.com/<jij>/App-lading-car/releases/latest en tik je op
# adempauze.apk.
on:
  push:
    paths:
      - 'adempauze/**'
      - '.github/workflows/adempauze.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adempauze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adempauze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests en schermafbeeldingen
        run: ./gradlew testDebugUnitTest --console=plain

      - name: APK bouwen
        env:
          ADEMPAUZE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk adempauze.apk

      - name: APK bewaren bij deze run
        uses: actions/upload-artifact@v4
        with:
          name: adempauze-apk
          path: adempauze/adempauze.apk

      - name: Schermafbeeldingen bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: adempauze/app/build/screenshots
          if-no-files-found: ignore

      - name: Release maken
        uses: softprops/action-gh-release@v2
        with:
          tag_name: adempauze-v1.0.${{ github.run_number }}
          name: Adempauze 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: adempauze/adempauze.apk
          body: |
            Open deze pagina op je telefoon en tik hieronder op **adempauze.apk**.

            Eerste keer? Volg de stappen in [adempauze/README.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/adempauze/README.md#installeren-op-je-samsung).
            Heb je Adempauze al? Dan installeert deze versie gewoon over de vorige heen; je instellingen blijven bewaard.

            Gebouwd van `${{ github.ref_name }}` (${{ github.sha }}).
