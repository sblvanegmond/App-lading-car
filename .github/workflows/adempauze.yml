name: Adempauze (Android)

# Bouwt de Android-app bij elke push die iets in adempauze/ verandert, draait
# de tests en zet de APK als download onder Releases:
#   https://github.com/<jij>/App-lading-car/releases/download/adempauze/adempauze.apk
on:
  push:
    paths:
      - 'adempauze/**'
      - '.github/workflows/adempauze.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adempauze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adempauze
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests en schermafbeeldingen
        run: ./gradlew testDebugUnitTest --console=plain

      - name: APK bouwen
        env:
          ADEMPAUZE_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk adempauze.apk

      - name: APK bewaren bij deze run
        uses: actions/upload-artifact@v4
        with:
          name: adempauze-apk
          path: adempauze/adempauze.apk

      - name: Schermafbeeldingen bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schermafbeeldingen
          path: adempauze/app/build/screenshots
          if-no-files-found: ignore

      # Eén vaste release met de tag "adempauze", die bij elke build wordt
      # vervangen. Hij mag nooit "latest" worden: die plek is van Laadmoment,
      # waarvan de downloadlink releases/latest/download/Laadmoment.apk is.
      # Alleen --latest=false is niet genoeg (GitHub valt dan terug op de
      # nieuwste release); een pre-release telt nooit mee voor "latest".
      - name: Release bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<NOTES
          **Downloaden op je telefoon:** open deze pagina op je Samsung en tik hieronder bij *Assets* op **adempauze.apk**.

          Directe link: https://github.com/${GH_REPO}/releases/download/adempauze/adempauze.apk

          Eerste keer? Volg de stappen in [adempauze/README.md](https://github.com/${GH_REPO}/blob/${GITHUB_SHA}/adempauze/README.md#installeren-op-je-samsung).
          Heb je Adempauze al? Dan installeert deze versie over de vorige heen; je instellingen blijven bewaard.

          Gebouwd van \`${GITHUB_SHA::7}\` op branch \`${GITHUB_REF_NAME}\`.
          NOTES
          # Oude, genummerde releases (adempauze-v…) opruimen.
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^adempauze-v' || true); do
            gh release delete "$tag" --yes --cleanup-tag
          done
          gh release delete adempauze --yes --cleanup-tag || true
          gh release create adempauze adempauze.apk \
            --target "$GITHUB_SHA" \
            --title "Adempauze 1.0.${{ github.run_number }}" \
            --notes-file notes.md \
            --prerelease \
            --latest=false
